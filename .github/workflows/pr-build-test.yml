name: PR build and tests

on:
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Hosted Windows runners do not certify interactive desktop automation. KillerShot has no
# separate test project (its checks are in-app --selftest runs), so this builds the app and CLI.
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: application
            project: KillerShot.csproj
            mode: build
            framework: ''
          - name: cli
            project: KillerShot.Cli/KillerShot.Cli.csproj
            mode: build
            framework: ''
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        env:
          PROJECT: ${{ matrix.project }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          New-Item -ItemType Directory -Force ci-results | Out-Null
          dotnet --info
          dotnet restore $env:PROJECT --verbosity minimal 2>&1 | Tee-Object ci-results/restore.log
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed. See restore.log.' }
          $buildArgs = @('build', $env:PROJECT, '--no-restore', '--configuration', 'Release', '--verbosity', 'minimal')
          if ($env:FRAMEWORK) { $buildArgs += @('--framework', $env:FRAMEWORK) }
          & dotnet @buildArgs 2>&1 | Tee-Object ci-results/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Build failed. See build.log.' }
      - name: Retain failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ matrix.name }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7
